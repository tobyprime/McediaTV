# Build workflow for McediaTV
#
# Builds the Fabric mod and Paper plugin across supported Minecraft versions.
# McediaCore artifacts (api, player, decoder, core, cn-platforms) are obtained
# by mcedia-core-deps — downloads from McediaCore's GitHub Release.
# Paper plugin (mcedia-mtv-plugin) builds independently.
# An all-in-one variant (mcedia-mtv-allinone) bundles mcedia-core (Windows
# native) + mcedia-cn-platforms into a single jar.
#
# Job structure:
#   discover → mcedia-core-deps (matrix: mc_version) → mcedia-mtv (matrix: mc_version)
#   discover → mcedia-mtv-plugin (matrix: server_version)
#   discover → mcedia-core-deps → mcedia-mtv-allinone (matrix: mc_version)
#                                                        ↓
#                                                     release
name: Build

on:
  push:
    branches: [master, dev]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      mc_versions:
        description: 'Minecraft versions (comma-separated, e.g. 1.21.11 or 1.21.11,26.1)'
        default: '1.21.11'
        required: true
        type: string
      create_release:
        description: 'Create a GitHub Release and Modrinth version after local loader validation'
        default: false
        type: boolean
      local_loader_verified:
        description: 'Confirm the final versionpack was Loader-tested for every supported Minecraft version'
        default: false
        required: true
        type: boolean
      core_ref:
        description: 'McediaCore git ref used as the internal build input'
        default: 'v1.3.2'
        required: false
        type: string

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8'

jobs:
  # ── Discover ────────────────────────────────────────────────────────
  # Normalizes MC versions from gradle.properties or workflow_dispatch
  # input into a JSON array consumed by downstream matrix jobs.
  discover:
    runs-on: ubuntu-latest
    outputs:
      mc_versions: ${{ steps.set-mc.outputs.mc_versions }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Minecraft versions
        id: set-mc
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            INPUT='${{ github.event.inputs.mc_versions }}'
          else
            INPUT=$(grep '^supported_mc_versions' gradle.properties | cut -d= -f2-)
          fi
          JSON=$(echo "$INPUT" | tr ',' '\n' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | jq --raw-input --slurp --compact-output \
              'split("\n") | map(select(length > 0))')
          echo "mc_versions=$JSON" >> "$GITHUB_OUTPUT"
          echo "Resolved MC versions: $JSON"

  # ── McediaCore build dependencies ─────────────────────────────────────
  # Core is an internal build input. Build the matching Core source tag instead
  # of downloading a public Core release.
  mcedia-core-deps:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mc_version: ${{ fromJSON(needs.discover.outputs.mc_versions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out matching McediaCore source
        uses: actions/checkout@v4
        with:
          repository: tobyprime/Mcedia
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.core_ref || 'v1.3.2' }}
          path: core-source

      - name: Set up JDK 21 for shared runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shared Core runtime
        working-directory: core-source
        run: ./gradlew --configure-on-demand :mcedia-core-runtime:publishMavenJavaPublicationToMavenRepository

      - name: Resolve Java version for ${{ matrix.mc_version }}
        id: jdk
        run: |
          PROP="core-source/mcedia-core/versions/${{ matrix.mc_version }}/gradle.properties"
          echo "java_version=$(grep '^java_version' "$PROP" | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Set up target JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.java_version }}

      - name: Build Core dependencies for ${{ matrix.mc_version }}
        working-directory: core-source
        run: |
          ./gradlew --configure-on-demand \
                    :mcedia-core-${{ matrix.mc_version }}:publishMavenJavaPublicationToMavenRepository \
                    :mcedia-cn-platforms-${{ matrix.mc_version }}:publishMavenJavaPublicationToMavenRepository \
                    -Psupported_mc_versions=${{ matrix.mc_version }} -x test

      - name: Upload publish directory
        uses: actions/upload-artifact@v4
        with:
          name: mcedia-core-publish-${{ matrix.mc_version }}
          path: core-source/publish/
          if-no-files-found: error

  # ── Paper plugin: mcedia-mtv-plugin ─────────────────────────────────
  # One Java 21 artifact targets the Paper 1.21.11 API baseline.
  mcedia-mtv-plugin:
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build universal Paper plugin
        run: ./gradlew :mcedia-mtv-plugin:build --configure-on-demand

      - name: Publish to Modrinth
        if: |
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.create_release == 'true'
          && github.event.inputs.local_loader_verified == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_MCEDIA_PROJECT_ID: ${{ secrets.MCEDIA_CORE_PROJECT_ID }}
        run: ./gradlew :mcedia-mtv-plugin:modrinth --configure-on-demand

      - name: Upload universal plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: mcedia-mtv-plugin-universal
          path: mcedia-mtv-plugin/build/libs/mcedia-mtv-plugin-universal-*.jar
          if-no-files-found: error


  # ── Fabric versionpack inputs ─────────────────────────────────────────
  # Build one real MTV/Core/Platforms implementation per Minecraft version.
  # The next job combines these mutually exclusive implementations into one
  # metadata-only Fabric wrapper.
  mcedia-mtv-version-inputs:
    needs: [discover, mcedia-core-deps]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc_version: ${{ fromJSON(needs.discover.outputs.mc_versions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download McediaCore publish directory
        uses: actions/download-artifact@v4
        with:
          name: mcedia-core-publish-${{ matrix.mc_version }}
          path: ../McediaCore/publish

      - name: Resolve Java version for ${{ matrix.mc_version }}
        id: jdk
        run: |
          PROP="mcedia-mtv/versions/${{ matrix.mc_version }}/gradle.properties"
          echo "java_version=$(grep '^java_version' "$PROP" | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.jdk.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.java_version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build MTV implementation for ${{ matrix.mc_version }}
        run: |
          ./gradlew :mcedia-mtv-${{ matrix.mc_version }}:buildAndCollect \
                    -Psupported_mc_versions=${{ matrix.mc_version }} -x test

      - name: Stage versionpack inputs
        run: |
          mkdir -p versionpack-input
          MC=${{ matrix.mc_version }}
          cp $(find build/libs/${MC} -name 'mcedia-mtv-*.jar' ! -name '*sources*' -type f | head -1) versionpack-input/mcedia-mtv-${MC}.jar
          cp $(find ../McediaCore/publish/top/tobyprime/mcedia_core-mc${MC} -name '*.jar' ! -name '*sources*' -type f | head -1) versionpack-input/mcedia-core-${MC}.jar
          cp $(find ../McediaCore/publish/top/tobyprime/mcedia_cn_platforms-mc${MC} -name '*.jar' ! -name '*sources*' -type f | head -1) versionpack-input/mcedia-platforms-${MC}.jar
          cp $(find ../McediaCore/publish/top/tobyprime/mcedia-core-runtime -name '*.jar' ! -name '*sources*' -type f | head -1) versionpack-input/mcedia-core-runtime.jar

      - name: Upload versionpack inputs (${{ matrix.mc_version }})
        uses: actions/upload-artifact@v4
        with:
          name: mcedia-mtv-versionpack-input-${{ matrix.mc_version }}
          path: versionpack-input/
          if-no-files-found: error

  # ── Fabric versionpack ────────────────────────────────────────────────
  mcedia-mtv-versionpack:
    needs: [discover, mcedia-mtv-version-inputs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Download versionpack inputs
        uses: actions/download-artifact@v4
        with:
          pattern: mcedia-mtv-versionpack-input-*
          path: inputs

      - name: Stage versionpack inputs
        run: |
          mkdir -p build/bundle-input/mtv-allinone
          for mc in $(grep '^supported_mc_versions' gradle.properties | cut -d= -f2 | tr ',' ' '); do
            cp inputs/mcedia-mtv-versionpack-input-${mc}/mcedia-mtv-${mc}.jar build/bundle-input/mtv-allinone/
            cp inputs/mcedia-mtv-versionpack-input-${mc}/mcedia-core-${mc}.jar build/bundle-input/mtv-allinone/
            cp inputs/mcedia-mtv-versionpack-input-${mc}/mcedia-platforms-${mc}.jar build/bundle-input/mtv-allinone/
          done
          cp inputs/mcedia-mtv-versionpack-input-$(grep '^supported_mc_versions' gradle.properties | cut -d= -f2 | cut -d, -f1)/mcedia-core-runtime.jar build/bundle-input/mtv-allinone/

      - name: Build Fabric versionpack
        run: ./gradlew -Pbundle_only=true :mcedia-mtv-allinone-bundle:bundleJar

      - name: Publish Fabric versionpack to unified Modrinth project
        if: |
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.create_release == 'true'
          && github.event.inputs.local_loader_verified == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_MCEDIA_PROJECT_ID: ${{ secrets.MCEDIA_CORE_PROJECT_ID }}
        run: ./gradlew :mcedia-mtv-allinone-bundle:modrinth

      - name: Upload Fabric versionpack
        uses: actions/upload-artifact@v4
        with:
          name: mcedia-mtv-versionpack-final
          path: build/libs/bundle/mcedia-mtv-allinone-versionpack-*.jar
          if-no-files-found: error

  # ── Release ──────────────────────────────────────────────────────────
  # Creates a GitHub Release with all built JARs as assets (normal + all-in-one).
  # Triggered by:
  #   - Push of a tag matching v* (e.g. v0.4.0, v1.0.0-rc1)
  #   - workflow_dispatch with create_release=true
  release:
    if: |
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.create_release == 'true'
      && github.event.inputs.local_loader_verified == 'true'
    needs: [mcedia-mtv-plugin, mcedia-mtv-versionpack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Fabric versionpack
        uses: actions/download-artifact@v4
        with:
          name: mcedia-mtv-versionpack-final
          path: artifacts

      - name: Download universal Paper plugin
        uses: actions/download-artifact@v4
        with:
          name: mcedia-mtv-plugin-universal
          path: artifacts

      - name: Gather JAR files
        run: |
          mkdir -p release-assets
          find artifacts -name '*.jar' -type f | while read jar; do
            echo "Collected: $jar"
            cp "$jar" release-assets/
          done
          echo "---"
          ls -lh release-assets/

      - name: Determine release tag and name
        id: tag
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "name=v${VERSION} (manual release)"
          else
            TAG=${GITHUB_REF_NAME}
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          body: |
            Automated build from commit ${{ github.sha }}.

            ## Modules

            - **mcedia-mtv-allinone-versionpack** — Single cross-version Fabric client package
            - **mcedia-mtv-plugin** — Paper/Folia plugin for channel management

            ## Supported Minecraft Versions

            ${{ needs.discover.outputs.mc_versions }}
          files: release-assets/*.jar
          fail_on_unmatched_files: true
