plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.21'
    id("xyz.jpenilla.run-paper") version "3.0.2"
    id 'com.modrinth.minotaur' version '2.+'
}

group = 'top.tobyprime'
version = '1.3.1'
base {
    archivesName = 'mcedia-mtv-plugin-universal'
}

def paperBaseline = '1.21.11-R0.1-SNAPSHOT'
def apiLevel = '1.21'
println "Building universal Paper plugin (baseline ${paperBaseline}, Java 21)"

// ========== 仓库 ==========
repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

// ========== 依赖 ==========
dependencies {
    paperweight.paperDevBundle(paperBaseline)
    compileOnly("io.papermc.paper:paper-api:${paperBaseline}")
    compileOnly("com.google.code.gson:gson:2.11.0")
    implementation("org.xerial:sqlite-jdbc:3.45.3.0")

    testImplementation("org.junit.jupiter:junit-jupiter:5.11.4")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.11.4")
}

// ========== 运行为服务端 ==========
tasks {
    runServer {
        minecraftVersion('1.21.11')
    }
}

// ========== Java 编译 ==========
def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

// ========== 测试 ==========
tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events("passed", "skipped", "failed")
        exceptionFormat = 'full'
    }
}

// ========== 资源处理 ==========
processResources {
    def props = [
        version      : version,
        apiLevel     : apiLevel
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

def modrinthProjectId = System.getenv('MODRINTH_MCEDIA_PROJECT_ID')
        ?: System.getenv('MODRINTH_MCEDIA_MTV_PLUGIN_PROJECT_ID')

modrinth {
    token = System.getenv('MODRINTH_TOKEN')

    if (modrinthProjectId != null && !modrinthProjectId.isEmpty()) {
        projectId = modrinthProjectId
    } else {
        logger.warn('MODRINTH_MCEDIA_PROJECT_ID not set — Modrinth publish disabled')
    }

    versionNumber = "${version}+paper-1.21.11-plus"
    uploadFile = tasks.named('jar').get()
    versionType = 'release'
    gameVersions = ['1.21.11', '26.1', '26.2']
    loaders = ['paper', 'folia']
    changelog = "Automated build from commit ${System.getenv('GITHUB_SHA')?.take(7) ?: 'local'}."
}
