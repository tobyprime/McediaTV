plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.21'
    id("xyz.jpenilla.run-paper") version "3.0.2"
    id 'com.modrinth.minotaur' version '2.+'
}

group = 'top.tobyprime'
version = '1.2.1'

// ========== 版本切换 ==========
// 通过 -PserverVersion=26.2 切换目标服务端版本
// 默认值可在 gradle.properties 或此处修改
def serverVersion = findProperty('serverVersion') ?: '1.21.11'

// 版本配置映射 —— 新增版本只需在此添加条目
def versionConfig = [
    '1.21.11': [
        paperBundle : '1.21.11-R0.1-SNAPSHOT',
        paperApi    : '1.21.11-R0.1-SNAPSHOT',
        paperVersion: '1.21.11',
        javaVersion : 21,
        apiLevel    : '1.21',
        javaFlags   : [
            '-XX:+UseG1GC'
        ]
    ],
    '26.1': [
        paperBundle : '26.1.2.build.69-stable',
        paperApi    : '26.1.2.build.69-stable',
        paperVersion: '26.1.2',
        javaVersion : 25,
        apiLevel    : '26.1',
        javaFlags   : [
            // Microsoft OpenJDK 25.0.3's G1 crashes (g1HeapRegionManager.cpp free-list
            // safepoint bug), so the 26.x servers run the stable Parallel collector.
            '-XX:+AlwaysPreTouch', '-XX:+DisableExplicitGC',
            '-XX:+ParallelRefProcEnabled', '-XX:+PerfDisableSharedMem',
            '-XX:+UseParallelGC'
        ]
    ],
    '26.2': [
        paperBundle : '26.2.build.92-stable',
        paperApi    : '26.2.build.92-stable',
        paperVersion: '26.2',
        javaVersion : 25,
        apiLevel    : '26.2',
        javaFlags   : [
            '-XX:+AlwaysPreTouch', '-XX:+DisableExplicitGC',
            '-XX:+ParallelRefProcEnabled', '-XX:+PerfDisableSharedMem',
            '-XX:+UseParallelGC'
        ]
    ]
]

def cfg = versionConfig[serverVersion]
if (cfg == null) {
    throw new GradleException("Unsupported server version: ${serverVersion}. " +
            "Supported versions: ${versionConfig.keySet().join(', ')}. " +
            "Usage: -PserverVersion=<version>")
}

println "Building for Paper ${serverVersion} (Java ${cfg.javaVersion}, API ${cfg.apiLevel})"

// ========== 版本特定源码目录（可选） ==========
// 若 versions/<serverVersion>/src/main/java/ 存在，会作为额外的源码目录
// 用于覆盖共享源码中因 API 变更需要适配的部分
def versionedSrcDir = file("versions/${serverVersion}/src/main/java")
def hasVersionedSrc = versionedSrcDir.exists()

// ========== 仓库 ==========
repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

// ========== 依赖 ==========
dependencies {
    paperweight.paperDevBundle(cfg.paperBundle)
    compileOnly("io.papermc.paper:paper-api:${cfg.paperApi}")
    compileOnly("com.google.code.gson:gson:2.11.0")
    implementation("org.xerial:sqlite-jdbc:3.45.3.0")

    testImplementation("org.junit.jupiter:junit-jupiter:5.11.4")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.11.4")
}

// 如果有版本特定源码，添加到主源码集
if (hasVersionedSrc) {
    sourceSets.main.java.srcDirs(versionedSrcDir)
    println "Including version-specific source: ${versionedSrcDir}"
}

// ========== 运行为服务端 ==========
tasks {
    runServer {
        minecraftVersion(cfg.paperVersion)
        // The JVM args declared per version (see javaFlags) are applied to the
        // spawned server process; without this the 26.x servers run the default G1
        // collector that crashes Microsoft OpenJDK 25.0.3.
        jvmArgs(cfg.javaFlags)
    }
}

// ========== Java 编译 ==========
def targetJavaVersion = cfg.javaVersion
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

// ========== 测试 ==========
tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events("passed", "skipped", "failed")
        exceptionFormat = 'full'
    }
}

// ========== 资源处理 ==========
processResources {
    def props = [
        version      : version,
        serverVersion: serverVersion,
        apiLevel     : cfg.apiLevel
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

def modrinthProjectId = System.getenv('MODRINTH_MCEDIA_MTV_PLUGIN_PROJECT_ID')

modrinth {
    token = System.getenv('MODRINTH_TOKEN')

    if (modrinthProjectId != null && !modrinthProjectId.isEmpty()) {
        projectId = modrinthProjectId
    } else {
        logger.warn('MODRINTH_MCEDIA_MTV_PLUGIN_PROJECT_ID not set — Modrinth publish disabled')
    }

    versionNumber = "${version}+${serverVersion}"
    uploadFile = tasks.named('jar').get()
    versionType = 'release'
    gameVersions = [cfg.paperVersion]
    loaders = ['paper', 'folia']
    changelog = "Automated build from commit ${System.getenv('GITHUB_SHA')?.take(7) ?: 'local'}."
}
